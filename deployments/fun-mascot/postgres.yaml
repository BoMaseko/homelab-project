apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fun-mascot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fun-mascot-db
  namespace: fun-mascot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fun-mascot-db
  template:
    metadata:
      labels:
        app: fun-mascot-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "funmascot"
            - name: POSTGRES_PASSWORD
              value: "funmascot123"
            - name: POSTGRES_DB
              value: "funmascot"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: fun-mascot-db
  namespace: fun-mascot
spec:
  selector:
    app: fun-mascot-db
  ports:
    - port: 5432
      targetPort: 5432

