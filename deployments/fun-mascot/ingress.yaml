apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fun-mascot-ingress
  namespace: fun-mascot
  annotations:
    # Traefik (k3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # If using cert-manager for Let's Encrypt:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Increase upload size for mascot/gallery images
    traefik.ingress.kubernetes.io/buffering.maxRequestBodyBytes: "10485760"
spec:
  # Uncomment and set your domain:
  # tls:
  #   - hosts:
  #       - funmascot.yourdomain.co.za
  #     secretName: fun-mascot-tls
  rules:
    - host: funmascot.maseko-lab.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fun-mascot-app
                port:
                  number: 80

